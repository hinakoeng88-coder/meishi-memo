<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>名刺ノート</title>
  <meta name="theme-color" content="#f7f5f2">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
:root {
  --bg:#f7f5f2; --bg2:#ffffff; --bg3:#f0ede8;
  --border:#e8e3dc; --border-md:#d4cec6;
  --text:#3a3530; --text-sub:#8a847c; --text-muted:#b8b2aa;
  --accent:#b07d62; --accent-lt:#f2e8e2;
  --green:#7a9e8e; --green-lt:#e8f0ec;
  --danger:#c0645a;
  --radius:16px; --radius-sm:10px; --radius-xs:6px;
  --shadow-sm:0 2px 8px rgba(58,53,48,0.07);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-right:env(safe-area-inset-right,0px);
}
html { font-size:15px; -webkit-text-size-adjust:100%; }
body { background:var(--bg); color:var(--text); font-family:'Noto Sans JP',sans-serif; font-weight:400; min-height:100dvh; overscroll-behavior:none; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }

/* HEADER */
.header { position:sticky; top:0; z-index:100; background:rgba(247,245,242,0.94); backdrop-filter:blur(14px); border-bottom:1px solid var(--border); padding-top:var(--safe-top); }
.header-inner { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
.logo { font-family:'Noto Serif JP',serif; font-size:1.05rem; font-weight:400; color:var(--text); letter-spacing:0.04em; display:flex; align-items:baseline; gap:7px; }
.logo-sub { font-size:0.67rem; font-weight:300; color:var(--text-sub); font-family:'Noto Sans JP',sans-serif; }
.header-actions { display:flex; gap:6px; }
.search-bar { padding:0 16px 12px; display:none; }
.search-bar.open { display:block; }
.search-bar input { width:100%; background:var(--bg3); border:1.5px solid var(--border); border-radius:24px; color:var(--text); font-family:'Noto Sans JP',sans-serif; font-size:0.88rem; padding:9px 16px; outline:none; }
.search-bar input:focus { border-color:var(--accent); }
.search-bar input::placeholder { color:var(--text-muted); }

/* TABS */
.tab-nav { display:flex; background:var(--bg2); border-bottom:1px solid var(--border); padding:0 16px; }
.tab { display:flex; align-items:center; gap:5px; padding:11px 16px; background:none; border:none; color:var(--text-muted); font-family:'Noto Sans JP',sans-serif; font-size:0.82rem; cursor:pointer; border-bottom:2px solid transparent; transition:all 0.2s; }
.tab.active { color:var(--accent); border-bottom-color:var(--accent); }
.tab-content { display:none; }
.tab-content.active { display:block; }

/* GROUP BAR */
.group-bar { display:flex; gap:6px; padding:10px 14px 4px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.group-bar::-webkit-scrollbar { display:none; }
.group-chip { display:inline-flex; align-items:center; gap:4px; padding:5px 12px; border-radius:20px; border:1.5px solid var(--border-md); background:var(--bg2); color:var(--text-sub); font-size:0.78rem; white-space:nowrap; cursor:pointer; flex-shrink:0; font-family:'Noto Sans JP',sans-serif; transition:all 0.15s; }
.group-chip.active { background:var(--accent); border-color:var(--accent); color:#fff; }
.group-chip-count { font-size:0.67rem; padding:1px 5px; border-radius:10px; background:var(--bg3); color:var(--text-muted); }
.group-chip.active .group-chip-count { background:rgba(255,255,255,0.25); color:#fff; }
.group-chip-edit { background:none; border:1.5px dashed var(--border-md); color:var(--text-muted); }

/* LIST */
.list-header { font-size:0.7rem; color:var(--text-muted); padding:8px 16px 2px; }
.card-grid { display:flex; flex-direction:column; gap:8px; padding:6px 14px calc(90px + var(--safe-bottom)); }
.card-grid.hidden { display:none; }
.biz-card { background:var(--bg2); border:1.5px solid var(--border); border-radius:var(--radius); padding:12px 13px; cursor:pointer; display:flex; align-items:center; gap:11px; box-shadow:var(--shadow-sm); transition:transform 0.15s; }
.biz-card:active { transform:scale(0.985); }
.biz-card-avatar { width:40px; height:40px; border-radius:50%; font-size:1rem; font-weight:500; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.biz-card-body { flex:1; min-width:0; }
.biz-card-name { font-size:0.93rem; font-weight:500; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.biz-card-sub { display:flex; align-items:center; gap:4px; font-size:0.75rem; color:var(--text-sub); margin-top:2px; white-space:nowrap; overflow:hidden; }
.furigana-badge { font-size:0.67rem; color:var(--accent); background:var(--accent-lt); padding:1px 5px; border-radius:4px; flex-shrink:0; }
.card-group-badges { display:flex; flex-wrap:wrap; gap:3px; margin-top:4px; }
.card-group-badge { font-size:0.65rem; background:var(--green-lt); color:var(--green); padding:1px 6px; border-radius:8px; }
.date-badge { font-size:0.67rem; color:var(--text-muted); flex-shrink:0; }

/* EMPTY */
.empty-state { display:flex; flex-direction:column; align-items:center; gap:10px; padding:60px 32px; text-align:center; }
.empty-icon { width:60px; height:60px; border-radius:50%; background:var(--accent-lt); color:var(--accent); display:flex; align-items:center; justify-content:center; margin-bottom:4px; }
.empty-title { font-size:0.93rem; font-weight:500; }
.empty-sub { font-size:0.8rem; color:var(--text-sub); line-height:1.5; }
.no-result { color:var(--text-muted); padding:48px 20px; text-align:center; font-size:0.85rem; }

/* SCAN */
.scan-area { padding:14px 14px calc(90px + var(--safe-bottom)); display:flex; flex-direction:column; gap:11px; }
.scan-card { background:var(--bg2); border:1.5px solid var(--border); border-radius:var(--radius); padding:18px 15px; box-shadow:var(--shadow-sm); }
.scan-title { font-size:0.93rem; font-weight:500; margin-bottom:3px; }
.scan-desc { font-size:0.78rem; color:var(--text-sub); margin-bottom:16px; line-height:1.5; }
.camera-preview-wrap { position:relative; width:100%; aspect-ratio:16/9; border-radius:var(--radius-sm); overflow:hidden; background:#1a1a1a; margin-bottom:12px; }
.camera-preview-wrap video { width:100%; height:100%; object-fit:cover; }
.camera-frame { position:absolute; inset:14px; pointer-events:none; }
.corner { position:absolute; width:18px; height:18px; border-color:#fff; border-style:solid; opacity:0.85; }
.corner.tl{top:0;left:0;border-width:2px 0 0 2px} .corner.tr{top:0;right:0;border-width:2px 2px 0 0}
.corner.bl{bottom:0;left:0;border-width:0 0 2px 2px} .corner.br{bottom:0;right:0;border-width:0 2px 2px 0}
.btn-capture { position:absolute; bottom:14px; left:50%; transform:translateX(-50%); width:54px; height:54px; border-radius:50%; background:rgba(255,255,255,0.95); border:3px solid rgba(255,255,255,0.4); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform 0.1s; }
.btn-capture:active { transform:translateX(-50%) scale(0.91); }
.capture-dot { width:34px; height:34px; border-radius:50%; background:var(--accent); display:block; }
.btn-close-cam { position:absolute; top:9px; right:9px; background:rgba(0,0,0,0.45); border:none; color:white; width:28px; height:28px; border-radius:50%; cursor:pointer; font-size:0.8rem; display:flex; align-items:center; justify-content:center; }
.preview-wrap { margin-bottom:12px; }
.preview-wrap img { width:100%; border-radius:var(--radius-sm); margin-bottom:10px; border:1px solid var(--border); }
.preview-actions { display:flex; gap:8px; }
.scan-buttons { display:flex; flex-direction:column; gap:9px; }
.btn-cam-launch { display:flex; align-items:center; justify-content:center; gap:8px; padding:14px; background:var(--accent); color:#fff; border:none; border-radius:var(--radius-sm); font-family:'Noto Sans JP',sans-serif; font-size:0.9rem; font-weight:500; cursor:pointer; width:100%; }
.btn-cam-launch:active { filter:brightness(0.91); }
.btn-file-launch { display:flex; align-items:center; justify-content:center; gap:8px; padding:12px; background:var(--bg3); color:var(--text-sub); border:1.5px solid var(--border-md); border-radius:var(--radius-sm); font-family:'Noto Sans JP',sans-serif; font-size:0.87rem; cursor:pointer; width:100%; }
.processing { text-align:center; padding:28px; font-size:0.87rem; color:var(--text-sub); }
.spinner { width:30px; height:30px; margin:0 auto 12px; border:2px solid var(--border-md); border-top-color:var(--accent); border-radius:50%; animation:spin 0.75s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* FAB */
.fab { position:fixed; bottom:calc(22px + var(--safe-bottom)); right:calc(16px + var(--safe-right)); z-index:50; width:50px; height:50px; border-radius:50%; background:var(--accent); color:#fff; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 16px rgba(176,125,98,0.35); }
.fab.hidden { display:none; }
.fab:active { transform:scale(0.93); }

/* BUTTONS */
.btn-icon { width:34px; height:34px; border-radius:var(--radius-xs); background:none; border:1.5px solid var(--border-md); color:var(--text-sub); cursor:pointer; display:flex; align-items:center; justify-content:center; }
.btn-icon.active { border-color:var(--accent); color:var(--accent); background:var(--accent-lt); }
.btn-sm-icon { width:30px; height:30px; }
.btn-primary { display:flex; align-items:center; justify-content:center; gap:5px; padding:11px 18px; background:var(--accent); color:#fff; border:none; border-radius:var(--radius-sm); font-family:'Noto Sans JP',sans-serif; font-size:0.88rem; font-weight:500; cursor:pointer; flex:1; }
.btn-primary:active { filter:brightness(0.9); }
.btn-secondary { padding:11px 18px; background:var(--bg3); color:var(--text-sub); border:1.5px solid var(--border-md); border-radius:var(--radius-sm); font-family:'Noto Sans JP',sans-serif; font-size:0.88rem; cursor:pointer; flex:1; }
.btn-sm { padding:7px 13px; background:var(--accent); color:#fff; border:none; border-radius:var(--radius-xs); font-family:'Noto Sans JP',sans-serif; font-size:0.78rem; font-weight:500; cursor:pointer; white-space:nowrap; }
.btn-danger { padding:11px 18px; background:none; color:var(--danger); border:1.5px solid #e8c4c0; border-radius:var(--radius-sm); font-family:'Noto Sans JP',sans-serif; font-size:0.88rem; cursor:pointer; }

/* MODAL */
.modal-overlay { position:fixed; inset:0; z-index:200; background:rgba(58,53,48,0.38); display:flex; align-items:flex-end; justify-content:center; animation:fadeIn 0.15s ease; }
@keyframes fadeIn { from { opacity:0; } }
.modal-box { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius) var(--radius) 0 0; width:100%; max-width:440px; max-height:90vh; overflow-y:auto; animation:slideUp 0.2s ease; padding-bottom:var(--safe-bottom); }
.modal-box-tall { max-height:94vh; }
@keyframes slideUp { from { transform:translateY(14px); opacity:0; } }
.modal-handle { width:36px; height:4px; background:var(--border-md); border-radius:2px; margin:10px auto 0; }
.modal-header { display:flex; align-items:center; justify-content:space-between; padding:13px 16px 11px; border-bottom:1px solid var(--border); }
.modal-header h3 { font-size:0.93rem; font-weight:500; }
.modal-body { padding:15px; }
.modal-footer { display:flex; gap:8px; padding:11px 15px calc(14px + var(--safe-bottom)); border-top:1px solid var(--border); }

/* DETAIL */
.detail-thumb { width:100%; max-height:130px; object-fit:cover; border-radius:var(--radius-sm); margin-bottom:14px; border:1px solid var(--border); }
.detail-fields { display:flex; flex-direction:column; }
.detail-row { display:flex; align-items:flex-start; padding:8px 0; border-bottom:1px solid var(--border); gap:10px; }
.detail-row:last-child { border-bottom:none; }
.detail-row-icon { width:24px; color:var(--text-muted); flex-shrink:0; padding-top:1px; display:flex; justify-content:center; }
.detail-row-body { flex:1; min-width:0; }
.detail-row-label { font-size:0.67rem; color:var(--text-muted); margin-bottom:2px; }
.detail-row-val { font-size:0.88rem; color:var(--text); word-break:break-all; line-height:1.4; }
.detail-row-val.name-val { font-size:1rem; font-weight:500; }
.detail-row-val.empty { color:var(--text-muted); }
.detail-row-val a { color:var(--accent); text-decoration:none; }
.furigana-row { font-size:0.75rem; color:var(--text-sub); padding:3px 0 3px 24px; border-bottom:1px solid var(--border); }
.detail-memo-wrap { margin-top:12px; }
.detail-memo-label { font-size:0.67rem; color:var(--text-muted); margin-bottom:5px; }
.detail-memo-wrap textarea { width:100%; background:var(--bg3); border:1.5px solid var(--border); border-radius:var(--radius-sm); color:var(--text); font-family:'Noto Sans JP',sans-serif; font-size:0.87rem; padding:9px 11px; resize:none; outline:none; min-height:80px; line-height:1.6; }
.detail-memo-wrap textarea:focus { border-color:var(--accent); }
.detail-date { font-size:0.68rem; color:var(--text-muted); text-align:right; padding-top:10px; }

/* EDIT FORM */
.edit-thumb { width:100%; max-height:100px; object-fit:cover; border-radius:var(--radius-sm); border:1px solid var(--border); margin-bottom:13px; }
.edit-form { display:flex; flex-direction:column; gap:9px; }
.form-group { display:flex; flex-direction:column; gap:4px; }
.form-group label { font-size:0.67rem; color:var(--text-muted); display:flex; align-items:center; gap:4px; }
.form-group input, .form-group textarea { background:var(--bg3); border:1.5px solid var(--border); border-radius:var(--radius-xs); color:var(--text); font-family:'Noto Sans JP',sans-serif; font-size:0.88rem; padding:9px 10px; outline:none; transition:border-color 0.2s; }
.form-group input[type="date"] { -webkit-appearance:none; }
.form-group input:focus, .form-group textarea:focus { border-color:var(--accent); background:var(--bg2); }
.form-group textarea { resize:vertical; min-height:58px; line-height:1.5; }

/* GROUP CHIPS IN FORM */
.group-check-wrap { display:flex; flex-wrap:wrap; gap:6px; padding-top:2px; }
.group-check-chip { padding:5px 12px; border-radius:20px; border:1.5px solid var(--border-md); background:var(--bg3); color:var(--text-sub); font-size:0.78rem; cursor:pointer; transition:all 0.15s; font-family:'Noto Sans JP',sans-serif; user-select:none; }
.group-check-chip.on { background:var(--green-lt); border-color:var(--green); color:var(--green); }

/* COMPANY SEARCH */
.company-wrap { position:relative; }
.company-search-btn { position:absolute; right:8px; top:50%; transform:translateY(-50%); background:var(--accent); color:#fff; border:none; border-radius:var(--radius-xs); font-size:0.72rem; font-family:'Noto Sans JP',sans-serif; padding:4px 9px; cursor:pointer; white-space:nowrap; }
.company-search-btn:disabled { background:var(--border-md); }
.company-input-pad { padding-right:70px !important; }
.addr-status { font-size:0.72rem; padding:5px 8px; border-radius:var(--radius-xs); display:none; margin-top:3px; }
.addr-status.loading { display:block; color:var(--text-sub); background:var(--bg3); }
.addr-status.ok { display:block; color:var(--green); background:var(--green-lt); }
.addr-status.ng { display:block; color:var(--danger); background:#fdf0ef; }
.candidates { background:var(--bg2); border:1.5px solid var(--border); border-radius:var(--radius-sm); overflow:hidden; display:none; margin-top:3px; }
.candidates.open { display:block; }
.candidate-item { padding:9px 12px; cursor:pointer; border-bottom:1px solid var(--border); }
.candidate-item:last-child { border-bottom:none; }
.candidate-item:active { background:var(--bg3); }
.candidate-name { font-size:0.87rem; color:var(--text); }
.candidate-addr { font-size:0.72rem; color:var(--text-sub); margin-top:1px; }

/* GROUP MANAGE MODAL */
.group-manage-list { display:flex; flex-direction:column; gap:7px; margin-bottom:14px; }
.group-manage-item { display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--bg3); border-radius:var(--radius-sm); border:1.5px solid var(--border); }
.group-manage-name { flex:1; font-size:0.88rem; font-weight:500; color:var(--text); }
.group-manage-count { font-size:0.75rem; color:var(--text-muted); }
.group-manage-del { width:26px; height:26px; border-radius:6px; background:none; border:1.5px solid #e8c4c0; color:var(--danger); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.group-add-row { display:flex; gap:8px; }
.group-add-row input { flex:1; background:var(--bg3); border:1.5px solid var(--border); border-radius:var(--radius-xs); color:var(--text); font-family:'Noto Sans JP',sans-serif; font-size:0.88rem; padding:9px 10px; outline:none; }
.group-add-row input:focus { border-color:var(--accent); background:var(--bg2); }
.group-empty-msg { font-size:0.83rem; color:var(--text-muted); text-align:center; padding:16px 0; }

/* BACKUP */
.backup-block { padding:2px 0 10px; }
.backup-block-title { display:flex; align-items:center; gap:7px; font-size:0.88rem; font-weight:500; color:var(--text); margin-bottom:5px; }
.backup-block-desc { font-size:0.78rem; color:var(--text-sub); line-height:1.6; }
.backup-divider { height:1px; background:var(--border); margin:14px 0; }

/* QR */
.qr-tabs { display:flex; gap:6px; margin-bottom:14px; }
.qr-tab { flex:1; padding:9px 8px; font-size:0.78rem; background:var(--bg3); border:1.5px solid var(--border); border-radius:var(--radius-sm); cursor:pointer; color:var(--text-sub); font-family:'Noto Sans JP',sans-serif; }
.qr-tab.active { background:var(--accent-lt); border-color:#e0cfc4; color:var(--accent); font-weight:500; }
.qr-desc { font-size:0.83rem; color:var(--text-sub); line-height:1.6; margin-bottom:4px; text-align:center; }
.qr-note { font-size:0.72rem; color:var(--text-muted); text-align:center; margin-top:4px; line-height:1.5; }
.qr-empty { font-size:0.85rem; color:var(--text-muted); text-align:center; padding:24px 0; }
.qr-page-nav { display:flex; align-items:center; justify-content:center; gap:14px; margin:8px 0; }
.qr-result-box { background:var(--bg3); border-radius:var(--radius-sm); padding:12px 14px; text-align:center; font-size:0.88rem; border:1px solid var(--border); }

/* TOAST */
.toast { position:fixed; bottom:calc(84px + var(--safe-bottom)); left:50%; transform:translateX(-50%); background:var(--text); color:#f7f5f2; padding:9px 18px; border-radius:20px; font-size:0.8rem; z-index:999; white-space:nowrap; animation:toastIn 0.2s ease, toastOut 0.3s ease 1.7s forwards; }
@keyframes toastIn  { from { opacity:0; transform:translateX(-50%) translateY(6px); } }
@keyframes toastOut { to   { opacity:0; transform:translateX(-50%) translateY(6px); } }
</style>
</head>
<body>
<div id="app">

  <header class="header">
    <div class="header-inner">
      <h1 class="logo">名刺ノート<span class="logo-sub">meishi note</span></h1>
      <div class="header-actions">
        <button class="btn-icon" id="searchToggle" title="検索">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </button>
        <button class="btn-icon" id="backupBtn" title="バックアップ">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </button>
        <button class="btn-icon" id="transferBtn" title="QR引き継ぎ">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        </button>
      </div>
    </div>
    <div class="search-bar" id="searchBar">
      <input type="text" id="searchInput" placeholder="名前・よみ・会社名・グループ・メモで検索" autocomplete="off">
    </div>
  </header>

  <nav class="tab-nav">
    <button class="tab active" data-tab="list">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>一覧
    </button>
    <button class="tab" data-tab="scan">

  <div class="modal-box">

<script>
'use strict';

/* ===== STATE ===== */
let cards            = load('meishi_cards', []);
let groups           = load('meishi_groups', []);
let activeGroup      = 'all';
let currentEditCard  = null;
let isEditingExisting = false;
let capturedImg      = null;
let cameraStream     = null;
let searchQuery      = '';
let currentDetailId  = null;

function load(key, def) {
  try { return JSON.parse(localStorage.getItem(key) || 'null') ?? def; }
  catch { return def; }
}
function saveCards()  { localStorage.setItem('meishi_cards',  JSON.stringify(cards));  }
function saveGroups() { localStorage.setItem('meishi_groups', JSON.stringify(groups)); }

/* ===== INIT ===== */
document.addEventListener('DOMContentLoaded', () => {
  renderGroupBar();
  renderCardGrid();
  bindEvents();
  loadTesseract();
});

/* ===== DATE UTILS ===== */
function todayStr() {
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function toDateInput(iso) {
  if (!iso) return todayStr();
  try { return new Date(iso).toISOString().slice(0,10); } catch { return todayStr(); }
}
function formatDate(s) {
  if (!s) return '';
  const [y,m,d]=s.split('-');
  return `${y}年${parseInt(m)}月${parseInt(d)}日`;
}
function dateToISO(s) { return s ? new Date(s+'T00:00:00').toISOString() : new Date().toISOString(); }

/* ===== 読み仮名 ===== */
const KY = {'田中':'たなか','山田':'やまだ','佐藤':'さとう','鈴木':'すずき','高橋':'たかはし','渡辺':'わたなべ','伊藤':'いとう','中村':'なかむら','小林':'こばやし','加藤':'かとう','吉田':'よしだ','山口':'やまぐち','松本':'まつもと','井上':'いのうえ','木村':'きむら','林':'はやし','斎藤':'さいとう','斉藤':'さいとう','清水':'しみず','山本':'やまもと','森':'もり','小川':'おがわ','池田':'いけだ','橋本':'はしもと','阿部':'あべ','石川':'いしかわ','山崎':'やまざき','中島':'なかじま','藤田':'ふじた','後藤':'ごとう','小野':'おの','岡田':'おかだ','長谷川':'はせがわ','村上':'むらかみ','近藤':'こんどう','石田':'いしだ','坂本':'さかもと','遠藤':'えんどう','青木':'あおき','藤井':'ふじい','西村':'にしむら','福田':'ふくだ','太田':'おおた','三浦':'みうら','岡本':'おかもと','松田':'まつだ','中川':'なかがわ','原':'はら','野口':'のぐち','竹内':'たけうち','原田':'はらだ','中田':'なかた','上田':'うえだ','平野':'ひらの','和田':'わだ','島田':'しまだ','川口':'かわぐち','土屋':'つちや','菊地':'きくち','宮崎':'みやざき','永田':'ながた','田村':'たむら','大野':'おおの','宮本':'みやもと','内田':'うちだ','安藤':'あんどう','谷口':'たにぐち','大塚':'おおつか','丸山':'まるやま','恵子':'けいこ','由美':'ゆみ','幸子':'さちこ','美穂':'みほ','直子':'なおこ','裕子':'ゆうこ','洋子':'ようこ','典子':'のりこ','明子':'あきこ','文子':'ふみこ','和子':'かずこ','節子':'せつこ','京子':'きょうこ','康子':'やすこ','智子':'ともこ','真由美':'まゆみ','真理子':'まりこ','奈々':'なな','愛':'あい','花':'はな','葵':'あおい','陽菜':'ひな','莉子':'りこ','菜々子':'ななこ','咲':'さき','太郎':'たろう','一郎':'いちろう','健太':'けんた','雄一':'ゆういち','誠':'まこと','哲也':'てつや','和彦':'かずひこ','大輔':'だいすけ','翔':'しょう','拓也':'たくや','隆':'たかし','博':'ひろし','剛':'つよし','勇':'いさむ','真司':'しんじ','健一':'けんいち','達也':'たつや'};
function autoFurigana(name) {
  if (!name) return '';
  if (/^[\u3040-\u309F\u30A0-\u30FF\s]+$/.test(name)) return toHira(name);
  if (KY[name]) return KY[name];
  const parts = name.split(/[\s　]+/);
  return parts.map(p => {
    if (KY[p]) return KY[p];
    let r = p;
    Object.keys(KY).sort((a,b)=>b.length-a.length).forEach(k=>{ r=r.replace(k,KY[k]); });
    return r;
  }).join(' ');
}
function toHira(s) { return s.replace(/[\u30A1-\u30F6]/g, c=>String.fromCharCode(c.charCodeAt(0)-0x60)); }

/* ===== SORT ===== */
function sortCards(list) {
  return [...list].sort((a,b) => {
    const ra=(a.furigana||a.name||'').replace(/\s/g,'');
    const rb=(b.furigana||b.name||'').replace(/\s/g,'');
    return ra.localeCompare(rb,'ja');
  });
}

/* ===== GROUP BAR ===== */
function renderGroupBar() {
  const bar = document.getElementById('groupBar');
  if (!bar) return;
  let html = `<button class="group-chip${activeGroup==='all'?' active':''}" data-gid="all">すべて<span class="group-chip-count">${cards.length}</span></button>`;
  groups.forEach(g => {
    const n = cards.filter(c=>(c.groups||[]).includes(g.id)).length;
    html += `<button class="group-chip${activeGroup===g.id?' active':''}" data-gid="${g.id}">${esc(g.name)}<span class="group-chip-count">${n}</span></button>`;
  });
  html += `<button class="group-chip group-chip-edit" id="openGroupModalBtn">＋ 編集</button>`;
  bar.innerHTML = html;
  bar.querySelectorAll('[data-gid]').forEach(el => el.addEventListener('click', ()=>{ activeGroup=el.dataset.gid; renderGroupBar(); renderCardGrid(); }));
  document.getElementById('openGroupModalBtn')?.addEventListener('click', openGroupModal);
}

/* ===== CARD GRID ===== */
function renderCardGrid() {
  const grid=document.getElementById('cardGrid'), empty=document.getElementById('emptyState'), hdr=document.getElementById('listHeader');
  let list = searchQuery
    ? cards.filter(c => {
        const gnames = (c.groups||[]).map(gid=>groups.find(g=>g.id===gid)?.name||'').join(' ');
        return [c.name,c.furigana,c.company,c.dept,c.email,c.phone,c.memo,gnames].join(' ').toLowerCase().includes(searchQuery.toLowerCase());
      })
    : cards;
  if (activeGroup !== 'all') list = list.filter(c=>(c.groups||[]).includes(activeGroup));
  list = sortCards(list);

  if (list.length === 0) {
    const msg = activeGroup!=='all' ? 'このグループに名刺はありません' : searchQuery ? `「${esc(searchQuery)}」は見つかりません` : '';
    if (msg) { grid.innerHTML=`<p class="no-result">${msg}</p>`; grid.classList.remove('hidden'); empty.style.display='none'; hdr.style.display='none'; }
    else { grid.classList.add('hidden'); empty.style.display=''; hdr.style.display='none'; }
    return;
  }
  empty.style.display='none'; grid.classList.remove('hidden');
  hdr.style.display=''; hdr.textContent=`${list.length} 枚`;
  grid.innerHTML = list.map(c => {
    const pal=palette(c.name);
    const dl = c.createdAt ? (() => { const d=new Date(c.createdAt); return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`; })() : '';
    const gb = (c.groups||[]).map(gid=>groups.find(g=>g.id===gid)).filter(Boolean).map(g=>`<span class="card-group-badge">${esc(g.name)}</span>`).join('');
    return `<div class="biz-card" data-id="${c.id}">
      <div class="biz-card-avatar" style="background:${pal.bg};color:${pal.fg}">${(c.name||'?').charAt(0)}</div>
      <div class="biz-card-body">
        <div class="biz-card-name">${esc(c.name||'（名前未記入）')}</div>
        <div class="biz-card-sub">${c.furigana?`<span class="furigana-badge">${esc(c.furigana)}</span>`:''}<span>${esc(c.company||c.dept||c.email||'—')}</span></div>
        ${gb?`<div class="card-group-badges">${gb}</div>`:''}
      </div>
      ${dl?`<span class="date-badge">${dl}</span>`:''}
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
    </div>`;
  }).join('');
  grid.querySelectorAll('.biz-card').forEach(el=>el.addEventListener('click',()=>openDetail(el.dataset.id)));
}

function palette(name) {
  const p=[{bg:'#f2e8e2',fg:'#b07d62'},{bg:'#e8f0ec',fg:'#5a8a72'},{bg:'#ede8f2',fg:'#7a6aaa'},{bg:'#e8edf5',fg:'#5a72a0'},{bg:'#f5ede8',fg:'#a06040'}];
  let h=0; for (const c of (name||'')) h=(h*31+c.charCodeAt(0))&0xffff; return p[h%p.length];
}
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ===== TABS ===== */
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.toggle('active',c.id===tab+'Tab'));
  document.getElementById('fab').classList.toggle('hidden',tab==='scan');
}

/* ===== EVENTS ===== */
function bindEvents() {
  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>switchTab(t.dataset.tab)));

  // 検索
  const sb=document.getElementById('searchBar'), si=document.getElementById('searchInput'), st=document.getElementById('searchToggle');
  st.addEventListener('click',()=>{ const o=sb.classList.toggle('open'); st.classList.toggle('active',o); if(o)si.focus(); else{si.value='';searchQuery='';renderCardGrid();} });
  si.addEventListener('input',e=>{ searchQuery=e.target.value.trim(); renderCardGrid(); });

  // ヘッダーボタン
  document.getElementById('backupBtn').addEventListener('click',()=>{ document.getElementById('restoreStatus').style.display='none'; document.getElementById('backupModal').style.display=''; });
  document.getElementById('transferBtn').addEventListener('click',openQrModal);

  // バックアップモーダル
  document.getElementById('backupModalClose').addEventListener('click',()=>document.getElementById('backupModal').style.display='none');
  document.getElementById('backupModal').addEventListener('click',e=>{ if(e.target===e.currentTarget) e.currentTarget.style.display='none'; });
  document.getElementById('doBackupBtn').addEventListener('click',doBackup);
  document.getElementById('restoreFileInput').addEventListener('change',e=>{ doRestore(e.target.files[0]); e.target.value=''; });

  // QRモーダル
  document.getElementById('qrModalClose').addEventListener('click',closeQrModal);
  document.getElementById('qrModal').addEventListener('click',e=>{ if(e.target===e.currentTarget) closeQrModal(); });

  // グループモーダル
  document.getElementById('groupModalClose').addEventListener('click',closeGroupModal);
  document.getElementById('groupModal').addEventListener('click',e=>{ if(e.target===e.currentTarget) closeGroupModal(); });
  document.getElementById('addGroupBtn').addEventListener('click',addGroup);
  document.getElementById('newGroupInput').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); addGroup(); } });

  // カメラ
  document.getElementById('openCamBtn').addEventListener('click',openCamera);
  document.getElementById('closeCamBtn').addEventListener('click',closeCamera);
  document.getElementById('captureBtn').addEventListener('click',capturePhoto);
  document.getElementById('retakeBtn').addEventListener('click',retake);
  document.getElementById('analyzeBtn').addEventListener('click',analyze);
  document.getElementById('fileInput').addEventListener('change',handleFile);
  document.getElementById('manualAddBtn').addEventListener('click',()=>openEditModal({name:'',furigana:'',company:'',dept:'',email:'',phone:'',address:'',website:'',memo:'',groups:[],createdAt:new Date().toISOString()},'',false));

  // detail
  document.getElementById('modalClose').addEventListener('click',()=>document.getElementById('modal').style.display='none');
  document.getElementById('modal').addEventListener('click',e=>{ if(e.target===e.currentTarget) e.currentTarget.style.display='none'; });
  document.getElementById('editCardBtn').addEventListener('click',()=>{ const c=cards.find(x=>x.id===currentDetailId); if(c){document.getElementById('modal').style.display='none'; openEditModal(c,c.imageUrl,true);} });
  document.getElementById('saveBtn').addEventListener('click',saveMemo);
  document.getElementById('deleteBtn').addEventListener('click',deleteCard);

  // edit
  document.getElementById('editModalClose').addEventListener('click',closeEditModal);
  document.getElementById('editModal').addEventListener('click',e=>{ if(e.target===e.currentTarget) closeEditModal(); });
  document.getElementById('editCancelBtn').addEventListener('click',closeEditModal);
  document.getElementById('editSaveBtn').addEventListener('click',saveEditCard);
}

/* ===== GROUP MODAL ===== */
function openGroupModal() {
  renderGroupManageList();
  document.getElementById('newGroupInput').value='';
  document.getElementById('groupModal').style.display='';
}
function closeGroupModal() {
  document.getElementById('groupModal').style.display='none';
  renderGroupBar(); renderCardGrid();
}
function renderGroupManageList() {
  const el=document.getElementById('groupManageList');
  if (groups.length===0) { el.innerHTML=`<p class="group-empty-msg">グループがまだありません</p>`; return; }
  el.innerHTML=`<div class="group-manage-list">${groups.map(g=>{

let tesseractReady=false;
function loadTesseract() { const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js'; s.onload=()=>tesseractReady=true; document.head.appendChild(s); }
async function analyze() {
  if (!capturedImg) return;
  document.getElementById('processing').style.display=''; document.getElementById('previewWrap').style.display='none'; document.getElementById('processingMsg').textContent='テキストを読み取り中...';
  let text='';
  if (tesseractReady && typeof Tesseract!=='undefined') { try { text=(await Tesseract.recognize(capturedImg,'jpn+eng',{logger:()=>{}})).data.text; } catch {} }
  const p=parseCard(text);
  if (p.name && !p.furigana) p.furigana=autoFurigana(p.name);
  p.createdAt=new Date().toISOString(); p.groups=[];
  document.getElementById('processing').style.display='none'; document.getElementById('scanButtons').style.display='';
  openEditModal(p,capturedImg,false); capturedImg=null;

function parseCard(text) {
  const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
  const r={name:'',furigana:'',company:'',dept:'',email:'',phone:'',address:'',website:'',memo:''};
  const eRx=/[\w.+-]+@[\w-]+\.[a-zA-Z]{2,}/,pRx=/(?:0\d{1,4}[-\s]?\d{1,4}[-\s]?\d{4})/,uRx=/(?:https?:\/\/|www\.)[^\s]+/i,zRx=/〒?\d{3}[-\s]?\d{4}/;
  for (const l of lines) {
    if (eRx.test(l)&&!r.email){r.email=l.match(eRx)[0];continue;}
    if (pRx.test(l)&&!r.phone){r.phone=l.match(pRx)[0];continue;}
    if (uRx.test(l)&&!r.website){r.website=l.match(uRx)[0];continue;}
    if (zRx.test(l)&&!r.address){r.address=l;continue;}
    if (/株式会社|有限会社|合同会社|Inc\.|Corp\./.test(l)&&!r.company){r.company=l;continue;}
    if (/部|課|室|事業|部長|課長|代表|マネージャー/.test(l)&&!r.dept){r.dept=l;continue;}
    if (/^[\u3040-\u309F\s]+$/.test(l)&&l.length<=20&&!r.furigana){r.furigana=l.trim();continue;}
    if (/[\u4E00-\u9FFF\u30A0-\u30FF\u3040-\u309F]/.test(l)&&l.length<=15&&!r.name){r.name=l;}
  }
  return r;
}

/* ===== 法人番号API ===== */
async function searchAddress(name) {
  if (!name||name.length<2) return [];
  try {
    const url=`https://api.houjin-bangou.nta.go.jp/4/name?id=00000&name=${encodeURIComponent(name)}&type=02&mode=2&target=1&from=1&count=10`;
    const res=await fetch(`https://corsproxy.io/?${encodeURIComponent(url)}`,{signal:AbortSignal.timeout(8000)});
    if (!res.ok) return [];
    const xml=(new DOMParser()).parseFromString(await res.text(),'application/xml');
    const out=[];
    xml.querySelectorAll('corporation').forEach(c=>{
      const n=c.querySelector('name')?.textContent||'';
      const a=(c.querySelector('prefectureName')?.textContent||'')+(c.querySelector('cityName')?.textContent||'')+(c.querySelector('streetNumber')?.textContent||'');
      if(n&&a) out.push({name:n,address:a});
    });
    return out;
  } catch { return []; }
}

function doRestore(file) {
  if (!file) return;
  const st=document.getElementById('restoreStatus');
  const r=new FileReader();
  r.onload=e=>{
    try {
      const data=JSON.parse(e.target.result);
      // 新旧両形式に対応（配列直接 or {cards,groups}）
      const imported=Array.isArray(data)?data:data.cards||[];
      const importedGroups=Array.isArray(data)?[]:data.groups||[];
      const newCards=imported.filter(ic=>!cards.find(c=>c.id===ic.id));
      const updCards=imported.filter(ic=> cards.find(c=>c.id===ic.id));
      cards=[...cards.filter(c=>!updCards.find(u=>u.id===c.id)),...updCards,...newCards];
      // グループもマージ
      importedGroups.forEach(ig=>{ if(!groups.find(g=>g.id===ig.id)) groups.push(ig); });
      saveCards(); saveGroups(); renderGroupBar(); renderCardGrid();
      st.style.display='block'; st.style.background='var(--green-lt)'; st.style.color='var(--green)';
      st.textContent=`✓ ${imported.length}枚を復元しました（新規:${newCards.length}枚）`;
      document.getElementById('backupModal').style.display='none';
      showToast(`${imported.length}枚の名刺を復元しました ✓`);
    } catch {
      st.style.display='block'; st.style.background='#fdf0ef'; st.style.color='var(--danger)';
      st.textContent='✗ ファイルを読み込めませんでした';
    }
  };
  r.readAsText(file);
}

  } else {
    const pages=[]; let chunk=[];
    for (const c of ed) {
      chunk.push(c);
      if (btoa(encodeURIComponent(JSON.stringify({cards:chunk,groups}))).length>LIMIT){chunk.pop();if(chunk.length)pages.push(chunk);chunk=[c];}
    }
    if (chunk.length) pages.push(chunk);
    let p=0;
    const render=()=>{

      area.innerHTML=`<p class="qr-desc">${pages.length}枚に分割しました。<br>順番にスキャンしてください。</p>

        </div>
        <div id="qrcode" style="display:flex;justify-content:center;margin:10px 0"></div>`;
      setTimeout(()=>new QRCode(document.getElementById('qrcode'),{text:`MEISHI2_P${p+1}of${pages.length}:`+d,width:190,height:190,colorDark:'#3a3530',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M}),50);
    };
    window.qrPrev=()=>{if(p>0){p--;render();}};
    window.qrNext=()=>{if(p<pages.length-1){p++;render();}};
    render();
  }
}
function showQrIn() {
  document.getElementById('qrInTab').classList.add('active'); document.getElementById('qrOutTab').classList.remove('active');
  document.getElementById('qrOutArea').style.display='none';
  const area=document.getElementById('qrInArea'); area.style.display='';
  area.innerHTML=`<p class="qr-desc">古い端末のQRをカメラでスキャンしてください</p>
    <div style="position:relative;width:100%;aspect-ratio:1;background:#1a1a1a;border-radius:12px;overflow:hidden;margin:12px 0">
      <video id="qrVideo" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover"></video>
      <div style="position:absolute;inset:20%;border:2px solid rgba(255,255,255,0.75);border-radius:8px;pointer-events:none"></div>
      <canvas id="qrCanvas" style="display:none"></canvas>
    </div>
    <p id="qrStat" class="qr-note">カメラを起動中...</p>
    <div id="qrResult" style="display:none;margin-top:10px"></div>`;
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})
    .then(s=>{ qrStream=s; const v=document.getElementById('qrVideo'); v.srcObject=s; v.onloadedmetadata=()=>{ v.play(); qrTimer=setInterval(scanQr,300); document.getElementById('qrStat').textContent='QRコードを枠内に合わせてください'; }; })
    .catch(()=>{ document.getElementById('qrStat').textContent='カメラを起動できませんでした'; });
}
function scanQr() {
  const v=document.getElementById('qrVideo'),c=document.getElementById('qrCanvas');
  if(!v||v.readyState!==4) return;
  c.width=v.videoWidth; c.height=v.videoHeight; c.getContext('2d').drawImage(v,0,0);
  const id=c.getContext('2d').getImageData(0,0,c.width,c.height);
  const code=jsQR(id.data,id.width,id.height,{inversionAttempts:'dontInvert'});
  if(code?.data.match(/^MEISHI/)){stopQrScan();processQr(code.data);}
}
function stopQrScan() { clearInterval(qrTimer); qrTimer=null; qrStream?.getTracks().forEach(t=>t.stop()); qrStream=null; }
function processQr(raw) {
  try {
    let payload,pageInfo=null;
    if (raw.startsWith('MEISHI2_P')) {
      const m=raw.match(/^MEISHI2_P(\d+)of(\d+):(.+)$/); if(!m) throw new Error();
      pageInfo={p:parseInt(m[1]),total:parseInt(m[2])};
      qrPages[pageInfo.p]=JSON.parse(decodeURIComponent(atob(m[3])));
    } else if (raw.startsWith('MEISHI2:')) {
      payload=JSON.parse(decodeURIComponent(atob(raw.replace('MEISHI2:',''))));
    } else if (raw.startsWith('MEISHI:')) {
      // 旧形式互換
      const d=JSON.parse(decodeURIComponent(atob(raw.replace('MEISHI:',''))));
      payload={cards:d,groups:[]};
    }
    const res=document.getElementById('qrResult'); res.style.display='';
    if (pageInfo) {
      const got=Object.keys(qrPages).length;
      if (got<pageInfo.total) {
        document.getElementById('qrStat').textContent=`${got}/${pageInfo.total}枚スキャン済み`;
        res.innerHTML=`<button class="btn-cam-launch" onclick="continueQr()">次のQRをスキャン</button>`; return;
      }
      const allCards=Object.values(qrPages).flatMap(p=>p.cards||[]);
      const allGroups=Object.values(qrPages).flatMap(p=>p.groups||[]);
      payload={cards:allCards,groups:allGroups};
    }
    const newCards=(payload.cards||[]).filter(ic=>!cards.find(c=>c.id===ic.id));
    (payload.groups||[]).forEach(ig=>{ if(!groups.find(g=>g.id===ig.id)) groups.push(ig); });
    document.getElementById('qrStat').textContent='✓ スキャン完了';
    res.innerHTML=`<div class="qr-result-box"><p>${(payload.cards||[]).length}枚の名刺を読み取りました</p><p style="font-size:0.8rem;color:var(--text-sub)">うち新規: ${newCards.length}枚</p></div>
      <button class="btn-primary" style="width:100%;margin-top:10px" id="doImport">${newCards.length}枚を追加する</button>`;
    document.getElementById('doImport').addEventListener('click',()=>{
      cards=[...cards,...newCards]; saveCards(); saveGroups(); renderGroupBar(); renderCardGrid(); closeQrModal();
      showToast(`${newCards.length}枚を追加しました ✓`);
    });
  } catch { document.getElementById('qrStat').textContent='読み取りに失敗しました。もう一度お試しください。'; setTimeout(()=>{ qrTimer=setInterval(scanQr,300); },1500); }
}
window.continueQr=()=>{ document.getElementById('qrResult').style.display='none'; document.getElementById('qrStat').textContent='QRコードを枠内に合わせてください'; qrTimer=setInterval(scanQr,300); };

/* ===== UTILS ===== */
function genId() { return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function showToast(msg) {
  document.querySelector('.toast')?.remove();
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2200);
}
</script>

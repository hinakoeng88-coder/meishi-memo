<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>名刺ノート</title>
  <meta name="theme-color" content="#f7f5f2">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#f7f5f2; --bg2:#ffffff; --bg3:#f0ede8;
  --border:#e8e3dc; --border-md:#d4cec6;
  --text:#3a3530; --text-sub:#8a847c; --text-muted:#b8b2aa;
  --accent:#b07d62; --accent-lt:#f2e8e2;
  --green:#7a9e8e; --green-lt:#e8f0ec;
  --danger:#c0645a;
  --radius:16px; --radius-sm:10px; --radius-xs:6px;
  --shadow-sm:0 2px 8px rgba(58,53,48,0.07);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-right:env(safe-area-inset-right,0px);
}
html { font-size:15px; -webkit-text-size-adjust:100%; }
body { background:var(--bg); color:var(--text); font-family:'Noto Sans JP',sans-serif; font-weight:400; min-height:100vh; min-height:100dvh; overscroll-behavior:none; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }

/* HEADER */
.header { position:sticky; top:0; z-index:100; background:rgba(247,245,242,0.94); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid var(--border); padding-top:var(--safe-top); }
.header-inner { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
.logo { font-family:'Noto Serif JP',serif; font-size:1.05rem; font-weight:400; color:var(--text); letter-spacing:0.04em; display:flex; align-items:baseline; gap:7px; }
.logo-sub { font-size:0.67rem; font-weight:300; color:var(--text-sub); letter-spacing:0.07em; font-family:'Noto Sans JP',sans-serif; }
.header-actions { display:flex; gap:6px; }
.search-bar { padding:0 16px 12px; display:none; }
.search-bar.open { display:block; }
.search-bar input { width:100%; background:var(--bg3); border:1.5px solid var(--border); border-radius:24px; color:var(--text); font-family:'Noto Sans JP',sans-serif; font-size:0.88rem; padding:9px 16px; outline:none; transition:border-color 0.2s; }
.search-bar input:focus { border-color:var(--accent); }
.search-bar input::placeholder { color:var(--text-muted); }

/* TABS */
.tab-nav { display:flex; background:var(--bg2); border-bottom:1px solid var(--border); padding:0 16px; }
.tab { display:flex; align-items:center; gap:5px; padding:11px 16px; background:none; border:none; color:var(--text-muted); font-family:'Noto Sans JP',sans-serif; font-size:0.82rem; cursor:pointer; border-bottom:2px solid transparent; transition:all 0.2s; }
.tab.active { color:var(--accent); border-bottom-color:var(--accent); }
.tab:not(.active):hover { color:var(--text-sub); }
.tab-content { display:none; }
.tab-content.active { display:block; }

/* LIST */
.list-header { font-size:0.7rem; color:var(--text-muted); padding:12px 16px 4px; letter-spacing:0.05em; }
.card-grid { display:flex; flex-direction:column; gap:8px; padding:8px 14px calc(90px + var(--safe-bottom)); }
.card-grid.hidden { display:none; }
.biz-card { background:var(--bg2); border:1.5px solid var(--border); border-radius:var(--radius); padding:13px 14px; cursor:pointer; display:flex; align-items:center; gap:12px; box-shadow:var(--shadow-sm); transition:transform 0.15s; }
.biz-card:active { transform:scale(0.985); }
.biz-card-avatar { width:40px; height:40px; border-radius:50%; font-size:1rem; font-weight:500; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.biz-card-body { flex:1; min-width:0; }
.biz-card-name { font-size:0.93rem; font-weight:500; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:2px; }
.biz-card-sub { display:flex; align-items:center; gap:5px; font-size:0.75rem; color:var(--text-sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
.furigana-badge { font-size:0.68rem; color:var(--accent); background:var(--accent-lt); padding:1px 5px; border-radius:4px; flex-shrink:0; }
.date-badge { font-size:0.68rem; color:var(--text-muted); margin-left:auto; flex-shrink:0; }

/* EMPTY */
.empty-state { display:flex; flex-direction:column; align-items:center; gap:10px; padding:60px 32px; text-align:center; }
.empty-icon { width:60px; height:60px; border-radius:50%; background:var(--accent-lt); color:var(--accent); display:flex; align-items:center; justify-content:center; margin-bottom:4px; }
.empty-title { font-size:0.93rem; font-weight:500; }
.empty-sub { font-size:0.8rem; color:var(--text-sub); line-height:1.5; }
.no-result { color:var(--text-muted); padding:48px 20px; text-align:center; font-size:0.85rem; }

/* SCAN */
.scan-area { padding:14px 14px calc(90px + var(--safe-bottom)); display:flex; flex-direction:column; gap:11px; }
.scan-card { background:var(--bg2); border:1.5px solid var(--border); border-radius:var(--radius); padding:18px 15px; box-shadow:var(--shadow-sm); }
.scan-title { font-size:0.93rem; font-weight:500; margin-bottom:3px; }
.scan-desc { font-size:0.78rem; color:var(--text-sub); margin-bottom:16px; line-height:1.5; }
.camera-preview-wrap { position:relative; width:100%; aspect-ratio:16/9; border-radius:var(--radius-sm); overflow:hidden; background:#1a1a1a; margin-bottom:12px; }
.camera-preview-wrap video { width:100%; height:100%; object-fit:cover; }
.camera-frame { position:absolute; inset:14px; pointer-events:none; }
.corner { position:absolute; width:18px; height:18px; border-color:#fff; border-style:solid; opacity:0.85; }
.corner.tl{top:0;left:0;border-width:2px 0 0 2px} .corner.tr{top:0;right:0;border-width:2px 2px 0 0}
.corner.bl{bottom:0;left:0;border-width:0 0 2px 2px} .corner.br{bottom:0;right:0;border-width:0 2px 2px 0}
.btn-capture { position:absolute; bottom:14px; left:50%; transform:translateX(-50%); width:54px; height:54px; border-radius:50%; background:rgba(255,255,255,0.95); border:3px solid rgba(255,255,255,0.4); cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 12px rgba(0,0,0,0.25); transition:transform 0.1s; }
.btn-capture:active { transform:translateX(-50%) scale(0.91); }
.capture-dot { width:34px; height:34px; border-radius:50%; background:var(--accent); display:block; }
.btn-close-cam { position:absolute; top:9px; right:9px; background:rgba(0,0,0,0.45); border:none; color:white; width:28px; height:28px; border-radius:50%; cursor:pointer; font-size:0.8rem; display:flex; align-items:center; justify-content:center; }
.preview-wrap { margin-bottom:12px; }
.preview-wrap img { width:100%; border-radius:var(--radius-sm); margin-bottom:10px; border:1px solid var(--border); }
.preview-actions { display:flex; gap:8px; }
.scan-buttons { display:flex; flex-direction:column; gap:9px; }
.btn-cam-launch { display:flex; align-items:center; justify-content:center; gap:8px; padding:14px; background:var(--accent); color:#fff; border:none; border-radius:var(--radius-sm); font-family:'Noto Sans JP',sans-serif; font-size:0.9rem; font-weight:500; cursor:pointer; box-shadow:0 2px 10px rgba(176,125,98,0.28); transition:filter 0.15s; width:100%; }
.btn-cam-launch:active { filter:brightness(0.91); }
.btn-file-launch { display:flex; align-items:center; justify-content:center; gap:8px; padding:12px; background:var(--bg3); color:var(--text-sub); border:1.5px solid var(--border-md); border-radius:var(--radius-sm); font-family:'Noto Sans JP',sans-serif; font-size:0.87rem; cursor:pointer; transition:background 0.15s; width:100%; }
.btn-file-launch:active { background:var(--border); }
.processing { text-align:center; padding:28px; font-size:0.87rem; color:var(--text-sub); }
.spinner { width:30px; height:30px; margin:0 auto 12px; border:2px solid var(--border-md); border-top-color:var(--accent); border-radius:50%; animation:spin 0.75s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* FAB */
.fab { position:fixed; bottom:calc(22px + var(--safe-bottom)); right:calc(16px + var(--safe-right)); z-index:50; width:50px; height:50px; border-radius:50%; background:var(--accent); color:#fff; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 16px rgba(176,125,98,0.35); transition:transform 0.15s; }
.fab:active { transform:scale(0.93); }
.fab.hidden { display:none; }

/* BUTTONS */
.btn-icon { width:34px; height:34px; border-radius:var(--radius-xs); background:none; border:1.5px solid var(--border-md); color:var(--text-sub); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.15s; }
.btn-icon:active { background:var(--bg3); }
.btn-icon.active { border-color:var(--accent); color:var(--accent); background:var(--accent-lt); }
.btn-sm-icon { width:30px; height:30px; border-radius:6px; }
.btn-primary { display:flex; align-items:center; justify-content:center; gap:5px; padding:11px 18px; background:var(--accent); color:#fff; border:none; border-radius:var(--radius-sm); font-family:'Noto Sans JP',sans-serif; font-size:0.88rem; font-weight:500; cursor:pointer; flex:1; transition:filter 0.15s; }
.btn-primary:active { filter:brightness(0.9); }
.btn-secondary { padding:11px 18px; background:var(--bg3); color:var(--text-sub); border:1.5px solid var(--border-md); border-radius:var(--radius-sm); font-family:'Noto Sans JP',sans-serif; font-size:0.88rem; cursor:pointer; flex:1; transition:background 0.15s; }
.btn-secondary:active { background:var(--border); }
.btn-sm { padding:7px 13px; background:var(--accent); color:#fff; border:none; border-radius:var(--radius-xs); font-family:'Noto Sans JP',sans-serif; font-size:0.78rem; font-weight:500; cursor:pointer; white-space:nowrap; }
.btn-danger { padding:11px 18px; background:none; color:var(--danger); border:1.5px solid #e8c4c0; border-radius:var(--radius-sm); font-family:'Noto Sans JP',sans-serif; font-size:0.88rem; cursor:pointer; }
.btn-danger:active { background:#fdf0ef; }

/* MODAL */
.modal-overlay { position:fixed; inset:0; z-index:200; background:rgba(58,53,48,0.38); display:flex; align-items:flex-end; justify-content:center; animation:fadeIn 0.15s ease; }
@keyframes fadeIn { from { opacity:0; } }
.modal-box { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius) var(--radius) 0 0; width:100%; max-width:440px; max-height:90vh; overflow-y:auto; animation:slideUp 0.2s ease; padding-bottom:var(--safe-bottom); }
.modal-box-tall { max-height:94vh; }
@keyframes slideUp { from { transform:translateY(14px); opacity:0; } }
.modal-handle { width:36px; height:4px; background:var(--border-md); border-radius:2px; margin:10px auto 0; }
.modal-header { display:flex; align-items:center; justify-content:space-between; padding:13px 16px 11px; border-bottom:1px solid var(--border); }
.modal-header h3 { font-size:0.93rem; font-weight:500; }
.modal-body { padding:15px; }
.modal-footer { display:flex; gap:8px; padding:11px 15px calc(14px + var(--safe-bottom)); border-top:1px solid var(--border); }

/* DETAIL */
.detail-thumb { width:100%; max-height:130px; object-fit:cover; border-radius:var(--radius-sm); margin-bottom:14px; border:1px solid var(--border); }
.detail-fields { display:flex; flex-direction:column; }
.detail-row { display:flex; align-items:flex-start; padding:9px 0; border-bottom:1px solid var(--border); gap:11px; }
.detail-row:last-child { border-bottom:none; }
.detail-row-icon { width:26px; color:var(--text-muted); flex-shrink:0; padding-top:1px; display:flex; justify-content:center; }
.detail-row-body { flex:1; min-width:0; }
.detail-row-label { font-size:0.67rem; color:var(--text-muted); margin-bottom:2px; }
.detail-row-val { font-size:0.88rem; color:var(--text); word-break:break-all; line-height:1.4; }
.detail-row-val.name-val { font-size:1rem; font-weight:500; }
.detail-row-val.empty { color:var(--text-muted); font-size:0.8rem; }
.detail-row-val a { color:var(--accent); text-decoration:none; }
.furigana-row { font-size:0.75rem; color:var(--text-sub); padding:4px 0 4px 26px; letter-spacing:0.05em; border-bottom:1px solid var(--border); }
.detail-memo-wrap { margin-top:13px; }
.detail-memo-label { font-size:0.67rem; color:var(--text-muted); margin-bottom:6px; }
.detail-memo-wrap textarea { width:100%; background:var(--bg3); border:1.5px solid var(--border); border-radius:var(--radius-sm); color:var(--text); font-family:'Noto Sans JP',sans-serif; font-size:0.87rem; padding:9px 11px; resize:none; outline:none; min-height:80px; line-height:1.6; transition:border-color 0.2s; }
.detail-memo-wrap textarea:focus { border-color:var(--accent); }
.detail-date { font-size:0.68rem; color:var(--text-muted); text-align:right; padding-top:10px; margin-top:4px; }

/* EDIT FORM */
.edit-thumb { width:100%; max-height:100px; object-fit:cover; border-radius:var(--radius-sm); border:1px solid var(--border); margin-bottom:13px; }
.edit-form { display:flex; flex-direction:column; gap:9px; }
.form-group { display:flex; flex-direction:column; gap:4px; }
.form-group label { font-size:0.67rem; color:var(--text-muted); display:flex; align-items:center; gap:5px; }
.form-group input, .form-group textarea { background:var(--bg3); border:1.5px solid var(--border); border-radius:var(--radius-xs); color:var(--text); font-family:'Noto Sans JP',sans-serif; font-size:0.88rem; padding:9px 10px; outline:none; transition:border-color 0.2s, background 0.2s; }
.form-group input[type="date"] { -webkit-appearance:none; appearance:none; }
.form-group input:focus, .form-group textarea:focus { border-color:var(--accent); background:var(--bg2); }
.form-group textarea { resize:vertical; min-height:58px; line-height:1.5; }
.form-hint-inline { font-size:0.67rem; color:var(--text-muted); }

/* 会社名検索まわり */
.company-wrap { position:relative; }
.company-search-btn {
  position:absolute; right:8px; top:50%; transform:translateY(-50%);
  background:var(--accent); color:#fff; border:none;
  border-radius:var(--radius-xs); font-size:0.72rem; font-family:'Noto Sans JP',sans-serif;
  padding:4px 9px; cursor:pointer; white-space:nowrap;
  transition:filter 0.15s;
}
.company-search-btn:active { filter:brightness(0.9); }
.company-search-btn:disabled { background:var(--border-md); cursor:default; }
.company-input-with-btn { padding-right:68px !important; }

.address-status {
  font-size:0.72rem; padding:5px 8px; border-radius:var(--radius-xs);
  display:none;
}
.address-status.loading { display:block; color:var(--text-sub); background:var(--bg3); }
.address-status.ok { display:block; color:var(--green); background:var(--green-lt); }
.address-status.ng { display:block; color:var(--danger); background:#fdf0ef; }

/* 候補リスト */
.company-candidates {
  background:var(--bg2); border:1.5px solid var(--border);
  border-radius:var(--radius-sm); overflow:hidden;
  box-shadow:var(--shadow-sm); display:none;
}
.company-candidates.open { display:block; }
.candidate-item {
  padding:10px 12px; cursor:pointer; border-bottom:1px solid var(--border);
  transition:background 0.12s;
}
.candidate-item:last-child { border-bottom:none; }
.candidate-item:active { background:var(--bg3); }
.candidate-name { font-size:0.88rem; color:var(--text); }
.candidate-addr { font-size:0.72rem; color:var(--text-sub); margin-top:2px; }

/* TOAST */
.toast { position:fixed; bottom:calc(84px + var(--safe-bottom)); left:50%; transform:translateX(-50%); background:var(--text); color:#f7f5f2; padding:9px 18px; border-radius:20px; font-size:0.8rem; z-index:999; white-space:nowrap; animation:toastIn 0.2s ease, toastOut 0.3s ease 1.7s forwards; }
@keyframes toastIn  { from { opacity:0; transform:translateX(-50%) translateY(6px); } }
@keyframes toastOut { to   { opacity:0; transform:translateX(-50%) translateY(6px); } }

/* QR */
.qr-tabs { display:flex; gap:6px; margin-bottom:14px; }
.qr-tab { flex:1; padding:9px 8px; font-size:0.78rem; background:var(--bg3); border:1.5px solid var(--border); border-radius:var(--radius-sm); cursor:pointer; color:var(--text-sub); font-family:'Noto Sans JP',sans-serif; transition:all 0.15s; }
.qr-tab.active { background:var(--accent-lt); border-color:#e0cfc4; color:var(--accent); font-weight:500; }
.qr-desc { font-size:0.83rem; color:var(--text-sub); line-height:1.6; margin-bottom:4px; text-align:center; }
.qr-note { font-size:0.72rem; color:var(--text-muted); text-align:center; margin-top:4px; line-height:1.5; }
.qr-empty { font-size:0.85rem; color:var(--text-muted); text-align:center; padding:24px 0; }
.qr-page-nav { display:flex; align-items:center; justify-content:center; gap:14px; margin:8px 0; }
.qr-result-box { background:var(--bg3); border-radius:var(--radius-sm); padding:12px 14px; text-align:center; font-size:0.88rem; color:var(--text); border:1px solid var(--border); }
</style>
</head>
<body>
<div id="app">

  <header class="header">
    <div class="header-inner">
      <h1 class="logo">名刺ノート<span class="logo-sub">meishi note</span></h1>
      <div class="header-actions">
        <button class="btn-icon" id="searchToggle" title="検索">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </button>
        <button class="btn-icon" id="transferBtn" title="データ引き継ぎ">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        </button>
      </div>
    </div>
    <div class="search-bar" id="searchBar">
      <input type="text" id="searchInput" placeholder="名前・よみ・会社名・メモで検索" autocomplete="off">
    </div>
  </header>

  <nav class="tab-nav">
    <button class="tab active" data-tab="list">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      一覧
    </button>
    <button class="tab" data-tab="scan">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      スキャン
    </button>
  </nav>

  <div id="listTab" class="tab-content active">
    <div id="emptyState" class="empty-state">
      <div class="empty-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
      </div>
      <p class="empty-title">名刺がまだありません</p>
      <p class="empty-sub">スキャンタブから名刺を<br>登録してみましょう</p>
      <button class="btn-primary" style="margin-top:6px;max-width:160px" onclick="switchTab('scan')">スキャンする</button>
    </div>
    <div id="listHeader" class="list-header" style="display:none"></div>
    <div id="cardGrid" class="card-grid hidden"></div>
  </div>

  <div id="scanTab" class="tab-content">
    <div class="scan-area">
      <div class="scan-card">
        <h2 class="scan-title">名刺をスキャン</h2>
        <p class="scan-desc">カメラで撮影するか、画像を選択してください</p>
        <div class="camera-preview-wrap" id="cameraWrap" style="display:none">
          <video id="cameraVideo" autoplay playsinline muted></video>
          <div class="camera-frame">
            <div class="corner tl"></div><div class="corner tr"></div>
            <div class="corner bl"></div><div class="corner br"></div>
          </div>
          <button class="btn-capture" id="captureBtn"><span class="capture-dot"></span></button>
          <button class="btn-close-cam" id="closeCamBtn">✕</button>
        </div>
        <canvas id="captureCanvas" style="display:none"></canvas>
        <div class="preview-wrap" id="previewWrap" style="display:none">
          <img id="previewImg" alt="名刺プレビュー">
          <div class="preview-actions">
            <button class="btn-secondary" id="retakeBtn">撮り直す</button>
            <button class="btn-primary" id="analyzeBtn">読み取る</button>
          </div>
        </div>
        <div class="scan-buttons" id="scanButtons">
          <button class="btn-cam-launch" id="openCamBtn">

function autoFurigana(name) {
  if (!name) return '';
  if (/^[\u3040-\u309F\u30A0-\u30FF\s　]+$/.test(name)) return toHiragana(name);
  if (KANJI_YOMI[name]) return KANJI_YOMI[name];
  const parts=name.split(/[\s　]+/);
  return parts.map(part => {
    if (KANJI_YOMI[part]) return KANJI_YOMI[part];
    let r=part;
    Object.keys(KANJI_YOMI).sort((a,b)=>b.length-a.length).forEach(k=>{ r=r.replace(k,KANJI_YOMI[k]); });
    return r;
  }).join(' ');
}
function toHiragana(s) { return s.replace(/[\u30A1-\u30F6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)); }

/* ---- 国税庁 法人番号API で住所を自動取得 ---- */
// APIエンドポイント（CORSプロキシ経由でXML取得）
async function searchCompanyAddress(companyName) {
  if (!companyName || companyName.length < 2) return [];
  try {
    // 国税庁法人番号公表サイト API v2
    const url = `https://api.houjin-bangou.nta.go.jp/4/name?id=00000&name=${encodeURIComponent(companyName)}&type=02&mode=2&target=1&from=1&count=10`;
    // CORSの問題があるためプロキシ経由
    const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(url)}`;
    const res = await fetch(proxyUrl, { signal: AbortSignal.timeout(8000) });
    if (!res.ok) return [];
    const text = await res.text();
    // XMLをパース
    const parser = new DOMParser();
    const xml = parser.parseFromString(text, 'application/xml');
    const corporations = xml.querySelectorAll('corporation');
    const results = [];
    corporations.forEach(corp => {
      const name     = corp.querySelector('name')?.textContent || '';
      const prefName = corp.querySelector('prefectureName')?.textContent || '';
      const cityName = corp.querySelector('cityName')?.textContent || '';
      const streetNumber = corp.querySelector('streetNumber')?.textContent || '';
      const address  = prefName + cityName + streetNumber;
      if (name && address) results.push({ name, address });
    });
    return results;
  } catch {
    return [];
  }
}

}

  let h=0; for (const c of (name||'')) h=(h*31+c.charCodeAt(0))&0xffff; return p[h%p.length];
}

function capturePhoto() {

/* ---- OCR ---- */
let tesseractReady=false;
function loadTesseract() {
  const s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js';
  s.onload=()=>{ tesseractReady=true; };
  document.head.appendChild(s);
}
async function analyze() {
  if (!capturedImageDataUrl) return;
  document.getElementById('processing').style.display='';
  document.getElementById('previewWrap').style.display='none';
  document.getElementById('processingMsg').textContent='テキストを読み取り中...';
  let text='';
  if (tesseractReady && typeof Tesseract!=='undefined') {
    try { const r=await Tesseract.recognize(capturedImageDataUrl,'jpn+eng',{logger:()=>{}}); text=r.data.text; } catch {}
  }
  const parsed=parseCardText(text);
  if (parsed.name && !parsed.furigana) parsed.furigana=autoFurigana(parsed.name);
  parsed.createdAt=new Date().toISOString();
  document.getElementById('processing').style.display='none';
  document.getElementById('scanButtons').style.display='';
  openEditModal(parsed,capturedImageDataUrl,false);
  capturedImageDataUrl=null;
}
function parseCardText(text) {
  const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
  const r={name:'',furigana:'',company:'',dept:'',email:'',phone:'',address:'',website:'',memo:''};
  const eRx=/[\w.+-]+@[\w-]+\.[a-zA-Z]{2,}/,pRx=/(?:0\d{1,4}[-\s]?\d{1,4}[-\s]?\d{4})/,uRx=/(?:https?:\/\/|www\.)[^\s]+/i,zRx=/〒?\d{3}[-\s]?\d{4}/;
  for (const line of lines) {
    if (eRx.test(line)&&!r.email){r.email=line.match(eRx)[0];continue;}
    if (pRx.test(line)&&!r.phone){r.phone=line.match(pRx)[0];continue;}
    if (uRx.test(line)&&!r.website){r.website=line.match(uRx)[0];continue;}
    if (zRx.test(line)&&!r.address){r.address=line;continue;}
    if (/株式会社|有限会社|合同会社|Inc\.|Corp\.|Ltd\./.test(line)&&!r.company){r.company=line;continue;}
    if (/部|課|室|事業|部長|課長|代表|マネージャー/.test(line)&&!r.dept){r.dept=line;continue;}
    if (/^[\u3040-\u309F\s　]+$/.test(line)&&line.length<=20&&!r.furigana){r.furigana=line.trim();continue;}
    if (/[\u4E00-\u9FFF\u30A0-\u30FF\u3040-\u309F]/.test(line)&&line.length<=15&&!r.name){r.name=line;}
  }
  return r;
}

      <div class="form-group">
        <label>住所</label>
        <input type="text" id="ef_address" value="${esc(data.address||'')}" placeholder="〒000-0000 浜松市...">
      </div>
      <div class="form-group">
        <label>Webサイト</label>
        <input type="url" id="ef_website" value="${esc(data.website||'')}" placeholder="https://example.com">
      </div>
      <div class="form-group">
        <label>ケース・関わりメモ</label>
        <textarea id="ef_memo" placeholder="例：子育て支援の研修で出会う。ヤングケアラー支援に詳しい方。次回の勉強会に声をかける予定。" style="min-height:88px">${esc(data.memo||'')}</textarea>
      </div>
    </div>`;

  // 氏名 → 読み仮名自動生成
  document.getElementById('ef_name').addEventListener('blur',e=>{
    const fi=document.getElementById('ef_furigana');
    if (e.target.value.trim()&&!fi.value) fi.value=autoFurigana(e.target.value.trim());
  });

  // 「住所を検索」ボタン
  document.getElementById('companySearchBtn').addEventListener('click', () => doCompanySearch());

  // 会社名でEnterキーも検索
  document.getElementById('ef_company').addEventListener('keydown', e => {
    if (e.key==='Enter') { e.preventDefault(); doCompanySearch(); }
  });

  document.getElementById('editModal').style.display='';
}

// 会社名で住所を検索して候補を表示
let searchDebounce=null;
async function doCompanySearch() {
  const name=document.getElementById('ef_company').value.trim();
  if (!name) { showToast('会社名・施設名を入力してください'); return; }

  const btn=document.getElementById('companySearchBtn');
  const status=document.getElementById('addressStatus');
  const candidates=document.getElementById('companyCandidates');

  btn.disabled=true; btn.textContent='検索中...';
  status.className='address-status loading'; status.textContent='法人番号データベースを検索中...';
  candidates.className='company-candidates'; candidates.innerHTML='';

  const results=await searchCompanyAddress(name);
  btn.disabled=false; btn.textContent='住所を検索';

  if (results.length===0) {
    status.className='address-status ng';
    status.textContent='見つかりませんでした。住所を手入力してください。';
    return;
  }

  if (results.length===1) {
    // 1件だけなら即セット
    document.getElementById('ef_address').value=results[0].address;
    status.className='address-status ok';
    status.textContent=`✓ 住所を自動入力しました（編集できます）`;
    return;
  }

  // 複数候補 → リスト表示
  status.className='address-status ok';
  status.textContent=`${results.length}件見つかりました。選んでください：`;
  candidates.className='company-candidates open';
  candidates.innerHTML=results.map((r,i)=>`
    <div class="candidate-item" data-index="${i}">
      <div class="candidate-name">${esc(r.name)}</div>
      <div class="candidate-addr">${esc(r.address)}</div>
    </div>`).join('');
  candidates.querySelectorAll('.candidate-item').forEach(el=>{
    el.addEventListener('click',()=>{
      const r=results[parseInt(el.dataset.index)];
      document.getElementById('ef_company').value=r.name;
      document.getElementById('ef_address').value=r.address;
      candidates.className='company-candidates';
      status.className='address-status ok';
      status.textContent='✓ 住所を自動入力しました（編集できます）';
    });
  });
}

function openEditFromDetail() {
  const card=cards.find(c=>c.id===currentDetailId); if(!card) return;
  closeDetailModal(); openEditModal(card,card.imageUrl,true);
}
function closeEditModal() { document.getElementById('editModal').style.display='none'; currentEditCard=null; isEditingExisting=false; }
function saveEditCard() {
  if (!currentEditCard) return;
  const dateVal=document.getElementById('ef_date').value;
  currentEditCard.createdAt=dateVal?dateInputToISO(dateVal):new Date().toISOString();
  currentEditCard.name    =document.getElementById('ef_name').value.trim();
  currentEditCard.furigana=document.getElementById('ef_furigana').value.trim();
  currentEditCard.company =document.getElementById('ef_company').value.trim();
  currentEditCard.dept    =document.getElementById('ef_dept').value.trim();
  currentEditCard.phone   =document.getElementById('ef_phone').value.trim();
  currentEditCard.email   =document.getElementById('ef_email').value.trim();
  currentEditCard.address =document.getElementById('ef_address').value.trim();
  currentEditCard.website =document.getElementById('ef_website').value.trim();
  currentEditCard.memo    =document.getElementById('ef_memo').value.trim();
  if (!currentEditCard.furigana&&currentEditCard.name) currentEditCard.furigana=autoFurigana(currentEditCard.name);
  if (isEditingExisting) { const i=cards.findIndex(c=>c.id===currentEditCard.id); if(i!==-1) cards[i]=currentEditCard; }
  else cards.unshift(currentEditCard);
  saveCards(); renderCardGrid(); closeEditModal();
  if (!isEditingExisting) switchTab('list');
  showToast('保存しました ✓');
}

/* ---- DETAIL MODAL ---- */

  const card=cards.find(c=>c.id===id); if(!card) return;
  currentDetailId=id;
  const ico=p=>`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">${p}</svg>`;
  const row=(icon,label,val,href='')=>`<div class="detail-row">
    <div class="detail-row-icon">${icon}</div>
    <div class="detail-row-body">
      <div class="detail-row-label">${label}</div>
      <div class="detail-row-val${label==='氏名'?' name-val':''}${!val?' empty':''}">
        ${val?(href?`<a href="${esc(href)}">${esc(val)}</a>`:esc(val)):'—'}
      </div>
    </div>
  </div>`;
  const dateDisplay=card.createdAt?formatDate(toDateInput(card.createdAt)):'';
  document.getElementById('modalBody').innerHTML=`
    ${card.imageUrl?`<img class="detail-thumb" src="${card.imageUrl}" alt="名刺">`:''}
    <div class="detail-fields">
      ${row(ico('<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>'),'氏名',card.name)}
      ${card.furigana?`<div class="furigana-row">${esc(card.furigana)}</div>`:''}
      ${row(ico('<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>'),'会社名・施設名',card.company)}
      ${row(ico('<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>'),'部署・役職',card.dept)}
      ${row(ico('<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.15 12 19.79 19.79 0 0 1 1.07 3.38 2 2 0 0 1 3.06 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.09 8.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21 16.92z"/>'),'電話',card.phone,card.phone?`tel:${card.phone}`:'')}
      ${row(ico('<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>'),'メール',card.email,card.email?`mailto:${card.email}`:'')}
      ${row(ico('<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>'),'住所',card.address)}
      ${row(ico('<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>'),'Web',card.website,card.website)}
    </div>
    <div class="detail-memo-wrap">
      <div class="detail-memo-label">📝 ケース・関わりメモ</div>
      <textarea id="memoArea" placeholder="ケースでの関わり、出会った場所、次のアクションなど...">${esc(card.memo||'')}</textarea>
    </div>
    ${dateDisplay?`<div class="detail-date">📅 ${dateDisplay} に名刺をもらいました</div>`:''}`;
  document.getElementById('modalTitle').textContent=card.name||'名刺詳細';

function closeDetailModal() { document.getElementById('modal').style.display='none'; currentDetailId=null; }
function saveDetailMemo() {
  if (!currentDetailId) return;
  const card=cards.find(c=>c.id===currentDetailId); if(!card) return;
  card.memo=document.getElementById('memoArea').value.trim();
  saveCards(); renderCardGrid(); closeDetailModal(); showToast('メモを保存しました ✓');
}
function deleteCurrentCard() {
  if (!currentDetailId||!confirm('この名刺を削除しますか？')) return;
  cards=cards.filter(c=>c.id!==currentDetailId);
  saveCards(); renderCardGrid(); closeDetailModal(); showToast('削除しました');
}

/* ---- QR引き継ぎ ---- */
let qrScanStream=null,qrScanInterval=null,importedPages={};
function openQrModal() {
  document.getElementById('qrModalBody').innerHTML=`
    <div class="qr-tabs">
      <button class="qr-tab active" id="qrExportTab" onclick="showQrExport()">📤 この端末から送る</button>
      <button class="qr-tab" id="qrImportTab" onclick="showQrImport()">📥 新しい端末で受け取る</button>
    </div>
    <div id="qrExportArea"></div>
    <div id="qrImportArea" style="display:none"></div>`;
  document.getElementById('qrModal').style.display='';
  showQrExport();
}
function closeQrModal() { stopQrScanner(); document.getElementById('qrModal').style.display='none'; importedPages={}; }
function showQrExport() {
  document.getElementById('qrExportTab').classList.add('active');
  document.getElementById('qrImportTab').classList.remove('active');
  stopQrScanner(); document.getElementById('qrImportArea').style.display='none';
  const area=document.getElementById('qrExportArea'); area.style.display='';
  if (cards.length===0){area.innerHTML=`<p class="qr-empty">名刺がまだありません</p>`;return;}
  const exportData=cards.map(c=>({id:c.id,name:c.name,furigana:c.furigana||'',company:c.company||'',dept:c.dept||'',email:c.email||'',phone:c.phone||'',address:c.address||'',website:c.website||'',memo:c.memo||'',createdAt:c.createdAt}));
  const compressed=btoa(encodeURIComponent(JSON.stringify(exportData)));
  const LIMIT=1800;
  if (compressed.length<=LIMIT) {
    area.innerHTML=`<p class="qr-desc">${cards.length}枚の名刺をQRにしました。<br>新しい端末でスキャンしてください。</p><div id="qrcode" style="display:flex;justify-content:center;margin:14px 0"></div><p class="qr-note">※ 名刺の画像は含まれません</p>`;
    setTimeout(()=>{ new QRCode(document.getElementById('qrcode'),{text:'MEISHI:'+compressed,width:200,height:200,colorDark:'#3a3530',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M}); },80);
  } else { showQrExportPaged(exportData,LIMIT); }
}
function showQrExportPaged(exportData,limit) {
  const area=document.getElementById('qrExportArea');
  const pages=[]; let chunk=[];
  for (const card of exportData) {
    chunk.push(card);
    if (btoa(encodeURIComponent(JSON.stringify(chunk))).length>limit){chunk.pop();if(chunk.length>0)pages.push(chunk);chunk=[card];}
  }
  if (chunk.length>0) pages.push(chunk);
  let p=0;
  const render=()=>{
    const data=btoa(encodeURIComponent(JSON.stringify(pages[p])));
    area.innerHTML=`<p class="qr-desc">名刺が多いため${pages.length}枚に分割しました。</p>
      <div class="qr-page-nav">
        <button class="btn-sm" onclick="qrPrev()" ${p===0?'disabled':''}>◀</button>
        <span style="font-size:13px;color:var(--text-sub)">${p+1} / ${pages.length}</span>
        <button class="btn-sm" onclick="qrNext()" ${p===pages.length-1?'disabled':''}>▶</button>
      </div>
      <div id="qrcode" style="display:flex;justify-content:center;margin:10px 0"></div>
      <p class="qr-note">このページ：${pages[p].length}枚</p>`;
    setTimeout(()=>{ new QRCode(document.getElementById('qrcode'),{text:`MEISHI_P${p+1}of${pages.length}:`+data,width:190,height:190,colorDark:'#3a3530',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M}); },50);
  };
  window.qrPrev=()=>{if(p>0){p--;render();}};
  window.qrNext=()=>{if(p<pages.length-1){p++;render();}};
  render();
}
function showQrImport() {
  document.getElementById('qrImportTab').classList.add('active');
  document.getElementById('qrExportTab').classList.remove('active');
  document.getElementById('qrExportArea').style.display='none';
  const area=document.getElementById('qrImportArea'); area.style.display='';
  area.innerHTML=`<p class="qr-desc">古い端末に表示したQRを<br>カメラでスキャンしてください</p>
    <div style="position:relative;width:100%;aspect-ratio:1;background:#1a1a1a;border-radius:12px;overflow:hidden;margin:12px 0">
      <video id="qrVideo" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover"></video>
      <div style="position:absolute;inset:20%;border:2px solid rgba(255,255,255,0.75);border-radius:8px;pointer-events:none"></div>
      <canvas id="qrCanvas" style="display:none"></canvas>
    </div>
    <p id="qrScanStatus" class="qr-note">カメラを起動中...</p>
    <div id="qrImportResult" style="display:none;margin-top:10px"></div>`;
  startQrScanner();
}
function startQrScanner() {
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})
    .then(stream=>{
      qrScanStream=stream;
      const v=document.getElementById('qrVideo'); v.srcObject=stream;
      v.onloadedmetadata=()=>{ v.play(); qrScanInterval=setInterval(scanQrFrame,300); document.getElementById('qrScanStatus').textContent='QRコードを枠内に合わせてください'; };
    }).catch(()=>{ document.getElementById('qrScanStatus').textContent='カメラを起動できませんでした'; });
}
function scanQrFrame() {
  const v=document.getElementById('qrVideo'),c=document.getElementById('qrCanvas');
  if(!v||v.readyState!==4) return;
  c.width=v.videoWidth; c.height=v.videoHeight;
  const ctx=c.getContext('2d'); ctx.drawImage(v,0,0);
  const id=ctx.getImageData(0,0,c.width,c.height);
  const code=jsQR(id.data,id.width,id.height,{inversionAttempts:'dontInvert'});
  if(code?.data.startsWith('MEISHI')){stopQrScanner();processQrData(code.data);}
}
function stopQrScanner() { clearInterval(qrScanInterval); qrScanInterval=null; qrScanStream?.getTracks().forEach(t=>t.stop()); qrScanStream=null; }
function processQrData(raw) {
  try {
    let json,pageInfo=null;
    if (raw.startsWith('MEISHI_P')) {
      const m=raw.match(/^MEISHI_P(\d+)of(\d+):(.+)$/); if(!m) throw new Error();
      pageInfo={page:parseInt(m[1]),total:parseInt(m[2])};
      importedPages[pageInfo.page]=JSON.parse(decodeURIComponent(atob(m[3])));
    } else { json=JSON.parse(decodeURIComponent(atob(raw.replace('MEISHI:','')))); }
    const resultArea=document.getElementById('qrImportResult'); resultArea.style.display='';
    if (pageInfo) {
      const received=Object.keys(importedPages).length;
      if (received<pageInfo.total) {
        document.getElementById('qrScanStatus').textContent=`${received}/${pageInfo.total} 枚スキャン済み`;
        resultArea.innerHTML=`<button class="btn-cam-launch" onclick="continueQrScan()">次のQRをスキャン</button>`; return;
      }
      json=Object.values(importedPages).flat();
    }
    const newCards=json.filter(ic=>!cards.find(c=>c.id===ic.id));
    document.getElementById('qrScanStatus').textContent='✓ スキャン完了';
    resultArea.innerHTML=`
      <div class="qr-result-box"><p>${json.length}枚の名刺を読み取りました</p><p style="color:var(--text-sub);font-size:0.8rem">うち新規: ${newCards.length}枚</p></div>
      <button class="btn-primary" style="width:100%;margin-top:10px" id="doImportBtn">${newCards.length}枚を追加する</button>`;
    document.getElementById('doImportBtn').addEventListener('click',()=>{ cards=[...cards,...newCards]; saveCards(); renderCardGrid(); closeQrModal(); showToast(`${newCards.length}枚の名刺を追加しました ✓`); });
  } catch { document.getElementById('qrScanStatus').textContent='読み取りに失敗しました。もう一度お試しください。'; setTimeout(()=>{qrScanInterval=setInterval(scanQrFrame,300);},1500); }
}
window.continueQrScan=()=>{ document.getElementById('qrImportResult').style.display='none'; document.getElementById('qrScanStatus').textContent='QRコードを枠内に合わせてください'; qrScanInterval=setInterval(scanQrFrame,300); };

/* ---- UTILS ---- */
function generateId() { return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function showToast(msg) {
  document.querySelector('.toast')?.remove();
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2200);
}
</script>
